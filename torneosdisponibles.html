<section class="info-vet">
<h1>Torneos Vigentes</h1>


<div id="lista"></div>

<button class="gris" onclick="location.href='index.html'">Volver</button>
</section>

<script>
function cargarTorneos() {
    firebase.database().ref("Torneos").get().then(snapshot => {
        const cont = document.getElementById("lista");
        cont.innerHTML = "";

        if (!snapshot.exists()) {
            cont.innerHTML = "<p>No hay torneos guardados.</p>";
            return;
        }

        snapshot.forEach(child => {
            const nombre = child.key;
            const div = document.createElement("div");
            div.className = "item";

            div.innerHTML = `
                <button class="verde" onclick="abrir('${nombre}')">${nombre}</button>
            `;

            cont.appendChild(div);
        });
    });
}

function abrir(nombre) {
    location.href = "torneo.html?t=" + nombre;
}



cargarTorneos();

</script>
