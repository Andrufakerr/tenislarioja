<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tenis</title>
  <link rel="icon" type="image/x-icon" href="imagenes/icono.ico">
  <link rel="stylesheet" href="estilos.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body>

<header class="menu">
  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="fotos.html">Fotos</a></li>
      <li><a href="torneosdisponibles.html">Torneos</a></li>
    </ul>
  </nav>
</header>

<section class="info-vet">

  <img src="imagenes/Logo.png" alt="Logo Tenis">

  <h1 id="titulo1"></h1>
  <h1 id="titulo2"></h1>

  <p><strong id="descripcion1"></strong></p>
  <p><strong id="descripcion2"></strong></p>

  <div class="whatsapp-section">
    <div class="whatsapp-line">
      <img src="imagenes/wsp.png" alt="WhatsApp">
      <strong>Número de WhatsApp:</strong>
    </div>

    <div class="whatsapp-number">
      <a id="numeroWsp" target="_blank"></a>
    </div>
  </div>

  <h2 style="margin-top:25px;">📍 Apretá el mapa para ver ubicación</h2>

  <!-- MAPA -->
  <a id="linkMapa"
     target="_blank"
     style="display:inline-block; text-align:center;">
    <img 
      src="imagenes/ubicacion.png" 
      alt="Ubicación en Google Maps"
      style="width:100%; max-width:300px; border-radius:12px;
             box-shadow:0 0 10px rgba(0,0,0,0.2); cursor:pointer;">
  </a>

  <a href="inscripcion.html" class="btn-turno">Inscribirse 🎾</a>
</section>

<footer class="footer-fixed">
  <p>Todos los derechos reservados, Academia Jose Herrera</p>
</footer>

<!-- SCRIPT -->
<script>
  // 🔥 CONFIGURACIÓN FIREBASE
  const firebaseConfig = {
  apiKey: "AIzaSyBS_ssFQaK2DhlLjiZANK2B2sJFztxnG50",
  authDomain: "paginadescripcion.firebaseapp.com",
  databaseURL: "https://paginadescripcion-default-rtdb.firebaseio.com",
  projectId: "paginadescripcion",
  storageBucket: "paginadescripcion.firebasestorage.app",
  messagingSenderId: "974200079044",
  appId: "1:974200079044:web:a814bddeabb123eed1ff91"
};


  firebase.initializeApp(firebaseConfig);

  const db = firebase.database();

  db.ref("infoTorneo").on("value", snapshot => {
    if (!snapshot.exists()) return;

    const data = snapshot.val();

    document.getElementById("titulo1").textContent = data.titulo1 || "";
    document.getElementById("titulo2").textContent = data.titulo2 || "";

    document.getElementById("descripcion1").textContent = data.descripcion1 || "";
    document.getElementById("descripcion2").textContent = data.descripcion2 || "";

    // WhatsApp
    const wsp = document.getElementById("numeroWsp");
    wsp.textContent = data.numeroWsp || "";
    wsp.href = "https://wa.me/" + data.numeroWsp;

    // Mapa (solo cambia el link)
    document.getElementById("linkMapa").href = data.ubicacionMapa || "#";
  });
</script>

</body>
</html>
